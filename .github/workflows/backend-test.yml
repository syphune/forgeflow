name: backend-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - run: go test -race -shuffle=on ./...
      - run: go vet ./...
      - run: go build ./cmd/api ./cmd/worker ./cmd/mcp ./cmd/mcp-bridge ./cmd/migrate
      - run: cd .. && ./scripts/check-generated.sh
      - run: cd .. && ./scripts/check-mcp-schema.sh
