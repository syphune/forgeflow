services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: forgeflow
      POSTGRES_DB: forgeflow
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeflow -d forgeflow"]
      interval: 2s
      timeout: 3s
      retries: 20
