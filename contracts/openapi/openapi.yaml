        phase: { type: string, enum: [INTAKE, SPECIFICATION, IMPLEMENTATION, TESTING, PULL_REQUEST, DEPLOYMENT] }
        gate: { type: string, enum: ["", SPECIFICATION_REVIEW, RUNNER_AVAILABLE, PULL_REQUEST_REVIEW, TEST_FEEDBACK, DEPLOYMENT_APPROVAL, HUMAN_VERIFICATION, CLARIFICATION] }
        attempt: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        current_agent_run_id: { type: string, format: uuid }
        pull_request_id: { type: string, format: uuid }
        commit_sha: { type: string }
        unresolved_positions: { type: array, items: { type: integer, minimum: 1 } }
        last_error: { type: string }
        version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    AutonomousFeedbackRequest:
      type: object
      required: [note]
      properties:
        source: { type: string, enum: [human, agent, ci, system] }
