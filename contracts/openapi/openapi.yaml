        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        last_heartbeat_at: { type: string, format: date-time, nullable: true }
        interruption_reason: { type: string }
        commit_sha: { type: string }
        pull_request_id: { type: string, format: uuid }
        result: { type: object, additionalProperties: true }
        error: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AgentRunStatus:
      type: string
      enum: [INTERRUPTED, QUEUED, PREPARING, PLANNING, INVESTIGATING, IMPLEMENTING, TESTING, REVIEWING, COMPLETED, FAILED, CANCELLED]
    AgentRunResultRequest:
      type: object
      properties:
        commit_sha: { type: string, maxLength: 128 }
        pull_request_id: { type: string, format: uuid }
