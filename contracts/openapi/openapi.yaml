openapi: 3.0.3
info:
  title: Forgeflow API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /work-items:
    get:
      operationId: listWorkItems
      summary: List or lexically search work items in the selected project
      parameters:
        - { $ref: "#/components/parameters/ProjectIDHeader" }
        - { name: status, in: query, schema: { type: string } }
        - {
            name: type,
            in: query,
            schema: { type: string, enum: [EPIC, STORY, TASK, BUG, SUB_TASK] },
          }
        - {
            name: priority,
            in: query,
            schema:
              { type: string, enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST] },
          }
        - {
            name: assignee_id,
            in: query,
            schema: { type: string, format: uuid },
          }
        - { name: sprint_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: repository_id,
            in: query,
            schema: { type: string, format: uuid },
          }
        - { name: q, in: query, schema: { type: string, maxLength: 256 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - {
            name: cursor,
            in: query,
            schema: { type: string, maxLength: 512 },
            description: Opaque cursor returned by the previous page,
          }
        - {
            name: include_archived,
            in: query,
            schema: { type: boolean, default: false },
            description: Include archived work items in the result,
          }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [updated, backlog], default: updated },
            description: Sort by recent activity or persisted backlog rank,
          }
      responses:
        "200":
          description: Work items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/WorkItemResponse" },
                    }
                  next_cursor: { type: string, nullable: true }
    post:
      operationId: createWorkItem
      summary: Create a work item
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /work-items/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    get:
      operationId: getWorkItem
      summary: Get a work item
      responses:
        "200":
          description: Work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: updateWorkItem
      summary: Update editable work-item fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkItemRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
    delete:
      operationId: archiveWorkItem
      summary: Archive a work item
      parameters:
        - {
            name: expected_version,
            in: query,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      responses:
        "204": { description: Archived }
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /work-items/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    post:
      operationId: restoreWorkItem
      summary: Restore an archived work item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /work-items/{id}/rank:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    post:
      operationId: moveWorkItemRank
      summary: Move a work item up or down in the project backlog
      parameters:
        - { $ref: "#/components/parameters/ProjectIDHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, expected_version]
              properties:
                direction: { type: string, enum: [up, down] }
                expected_version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Reordered work item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItemResponse" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /work-items/{id}/move:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - $ref: "#/components/parameters/ProjectIDHeader"
    post:
      operationId: moveWorkItem
      summary: Atomically transition and rank a work item in the board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveWorkItemRequest" }
      responses:
        "200":
          description: Moved work item and updated column versions
          content:
            application/json: { schema: { $ref: "#/components/schemas/MoveWorkItemResponse" } }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /work-items/{id}/activity:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    get:
      operationId: listWorkItemActivity
      summary: List activity for a work item
      parameters:
        - { $ref: "#/components/parameters/ProjectIDHeader" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Work item activity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditRecord" }
  /work-items/{id}/transitions:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    post:
      operationId: transitionWorkItem
      summary: Transition a work item through the server-side workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: Transitioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /work-items/{id}/assignments:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    post:
      operationId: assignWorkItem
      summary: Assign a work item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
  /work-items/{id}/labels:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    get:
      operationId: listWorkItemLabels
      responses:
        "200":
          description: Labels attached to the work item
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Label" },
                    }
    post:
      operationId: addWorkItemLabel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelRequest" }
      responses:
        "201":
          description: Label attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
  /work-items/{id}/custom-fields:
    parameters:
      - { $ref: "#/components/parameters/WorkItemID" }
      - { name: project_id, in: query, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listWorkItemCustomFieldValues
      responses:
        "200":
          description: Typed custom field values
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CustomFieldValue" } }
  /work-items/{id}/custom-fields/{field_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkItemID" }
      - { name: field_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: project_id, in: query, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setWorkItemCustomFieldValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: { value: { type: string, nullable: true } }
      responses:
        "200":
          description: Updated custom field value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomFieldValue" }
  /work-items/{id}/labels/{label_id}:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - {
          name: label_id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      operationId: removeWorkItemLabel
      responses: { "204": { description: Label detached } }
  /work-items/{id}/comments:
    parameters:
      - { $ref: "#/components/parameters/WorkItemID" }
    get:
      operationId: listComments
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Comment" },
                    }
    post:
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
  /work-items/{id}/comments/{comment_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkItemID" }
      - {
          name: comment_id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: updateComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
    delete:
      operationId: deleteComment
      responses:
        "200":
          description: Comment soft-deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
  /work-items/{id}/links:
    parameters:
      - { $ref: "#/components/parameters/WorkItemID" }
    get:
      operationId: listWorkItemLinks
      responses:
        "200":
          description: Work item links
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/WorkItemLink" },
                    }
    post:
      operationId: createWorkItemLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemLinkRequest"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItemLink" }
  /work-items/{id}/links/{link_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkItemID" }
      - {
          name: link_id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      operationId: deleteWorkItemLink
      responses:
        "204": { description: Link removed }
  /work-items/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - $ref: "#/components/parameters/ProjectIDHeader"
    get:
      operationId: listWorkItemAttachments
      summary: List work-item attachments
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Attachment" }
    post:
      operationId: uploadWorkItemAttachment
      summary: Upload a bounded work-item attachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
  /work-items/{id}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - $ref: "#/components/parameters/ProjectIDHeader"
      - name: attachment_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadWorkItemAttachment
      summary: Download a work-item attachment
      responses:
        "200": { description: Attachment bytes }
    delete:
      operationId: deleteWorkItemAttachment
      summary: Delete a work-item attachment
      responses:
        "204": { description: Attachment deleted }
  /work-items/{id}/specification:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    get:
      operationId: getSpecification
      summary: Get the structured specification and readiness result
      responses:
        "200":
          description: Specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationResponse"
    patch:
      operationId: updateSpecification
      summary: Update unverified human-provided specification content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecificationUpdateRequest"
      responses:
        "200":
          description: Updated specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificationResponse"
  /work-items/{id}/specification/review:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    post:
      operationId: reviewSpecification
      summary: Human-review an immutable specification version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecificationReviewRequest" }
      responses:
        "200":
          description: Reviewed specification
          content:
            application/json: { schema: { $ref: "#/components/schemas/Specification" } }
        "409": { $ref: "#/components/responses/ConflictError" }
  /work-items/{id}/specification/versions:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - $ref: "#/components/parameters/ProjectIDHeader"
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    get:
      operationId: listSpecificationFieldVersions
      summary: List immutable specification field revisions
      responses:
        "200":
          description: Specification field revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SpecificationFieldVersion" }
  /work-items/{id}/specification/proposals:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    post:
      operationId: proposeSpecificationField
      summary: Submit an AI proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalRequest"
      responses:
        "201":
          description: Proposal created
    get:
      operationId: listSpecificationProposals
      responses:
        "200":
          description: Proposals and their review status
  /work-items/{id}/specification/proposals/{proposal_id}/accept:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - {
          name: proposal_id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: acceptSpecificationProposal
      summary: Accept a proposal as unverified content
      responses:
        "200":
          description: Proposal accepted without human verification
  /work-items/{id}/specification/proposals/{proposal_id}/reject:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - {
          name: proposal_id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: rejectSpecificationProposal
      summary: Reject an AI proposal
      responses:
        "200":
          description: Proposal rejected
  /work-items/{id}/specification/verifications:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    post:
      operationId: verifySpecification
      summary: Explicitly verify a specification field or child record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationRequest"
      responses:
        "204":
          description: Verified
        "403":
          $ref: "#/components/responses/ValidationError"
  /work-items/{id}/analyses:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
    get:
      operationId: listWorkItemAnalyses
      responses:
        "200":
          description: Untrusted AI analyses
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Analysis" } }
    post:
      operationId: createWorkItemAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisRequest" }
      responses:
        "201":
          description: Analysis recorded as an untrusted hypothesis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Authenticated actor
          content:
            application/json: { schema: { $ref: "#/components/schemas/Actor" } }
  /me/tokens:
    get:
      operationId: listPersonalAccessTokens
      responses:
        "200":
          description: Personal access tokens without secret material
    post:
      operationId: createPersonalAccessToken
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: "#/components/schemas/CreateTokenRequest" } }
      responses:
        "201":
          description: Token; the secret is returned only once
          content:
            application/json:
              { schema: { $ref: "#/components/schemas/PersonalAccessToken" } }
  /me/tokens/{id}:
    delete:
      operationId: revokePersonalAccessToken
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "204": { description: Revoked } }
  /auth/github/start:
    get:
      operationId: startGitHubOAuth
      responses: { "302": { description: Redirect to GitHub } }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Session revoked and cookies cleared }
  /auth/github/callback:
    get:
      operationId: completeGitHubOAuth
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses: { "302": { description: Redirect after login } }
  /organizations:
    get:
      operationId: listOrganizations
      responses:
        "200":
          description: Organizations available for selection
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
  /organizations/current:
    get:
      operationId: getCurrentOrganization
      responses: { "200": { description: Current organization } }
  /organizations/{id}/authorization:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOrganizationAuthorization
      responses:
        "200":
          description: Effective organization-scoped authorization
          content:
            application/json: { schema: { $ref: "#/components/schemas/AuthorizationContext" } }
  /organizations/current/members:
    get:
      operationId: listOrganizationMembers
      responses: { "200": { description: Organization members } }
    post:
      operationId: addOrganizationMember
      requestBody:
        required: true
        content:
          application/json:
            {
              schema:
                { $ref: "#/components/schemas/OrganizationMemberRequest" },
            }
      responses: { "201": { description: Organization member added } }
  /organizations/current/members/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setOrganizationMemberRole
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: "#/components/schemas/MemberRoleRequest" } }
      responses:
        "200":
          description: Updated organization member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "409": { $ref: "#/components/responses/ConflictError" }
    delete:
      operationId: removeOrganizationMember
      responses:
        "204": { description: Organization member removed }
        "409": { $ref: "#/components/responses/ConflictError" }
  /workspaces:
    get:
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: "#/components/schemas/CreateTenantRequest" } }
      responses: { "201": { description: Workspace created } }
  /workspaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateWorkspace
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: "#/components/schemas/RenameRequest" } }
      responses:
        "200":
          description: Workspace updated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Workspace" } }
  /workspaces/{id}/authorization:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWorkspaceAuthorization
      responses:
        "200":
          description: Effective workspace-scoped authorization
          content:
            application/json: { schema: { $ref: "#/components/schemas/AuthorizationContext" } }
  /projects:
    get:
      operationId: listProjects
      parameters:
        - {
            name: workspace_id,
            in: query,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: "#/components/schemas/CreateProjectRequest" } }
      responses: { "201": { description: Project created } }
  /projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: "#/components/schemas/RenameRequest" } }
      responses:
        "200":
          description: Project updated
          content:
            application/json: { schema: { $ref: "#/components/schemas/Project" } }
  /projects/{id}/authorization:
    parameters:
