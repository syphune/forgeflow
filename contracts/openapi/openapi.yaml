    AgentRunTestResultsRequest:
      type: object
      properties:
        test_cases: { type: array, items: { $ref: "#/components/schemas/AgentRunTestCaseResult" }, maxItems: 200 }
        review_note: { type: string, maxLength: 4000 }
    AutonomousPolicy:
      type: object
      required: [enabled, providers, runtime, max_attempts, timeout_seconds, auto_retry, auto_create_pr, test_scope, mcp_permissions, execution_profile]
