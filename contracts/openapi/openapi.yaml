        repository_id: { type: string, format: uuid }
        base_sha: { type: string, maxLength: 128 }
        branch: { type: string, maxLength: 255 }
        objective: { type: string, minLength: 1, maxLength: 131072 }
        agent_provider: { type: string, enum: [codex, claude] }
        agent_name: { type: string, maxLength: 120 }
        model: { type: string, maxLength: 120 }
        target_environment: { type: string, maxLength: 120 }
        test_case_positions: { type: array, items: { type: integer, minimum: 1 }, maxItems: 200 }
        policy: { $ref: "#/components/schemas/AutonomousPolicy" }
    AutonomousRun:
      type: object
      required: [id, organization_id, project_id, work_item_id, objective, agent_provider, agent_name, policy, status, phase, attempt, max_attempts, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        work_item_id: { type: string, format: uuid }
        repository_id: { type: string, format: uuid }
        base_sha: { type: string }
        branch: { type: string }
        objective: { type: string }
        agent_provider: { type: string }
        agent_name: { type: string }
        model: { type: string }
        target_environment: { type: string }
        policy: { $ref: "#/components/schemas/AutonomousPolicy" }
