components:
  parameters:
    WorkItemID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AutonomousRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectPathID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectIDHeader:
      name: X-Project-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateWorkItemRequest:
      type: object
      required: [project_id, type, title]
      properties:
        project_id: { type: string, format: uuid }
        type: { type: string, enum: [EPIC, STORY, TASK, BUG, SUB_TASK] }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        repository_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        assignee_id: { type: string, format: uuid, nullable: true }
        priority: { type: string, enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST] }
        due_at: { type: string, format: date-time, nullable: true }
        estimate_points:
          { type: integer, minimum: 0, maximum: 100, nullable: true }
        sprint_id: { type: string, format: uuid, nullable: true }
    UpdateWorkItemRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        parent_id: { type: string, format: uuid, nullable: true }
        repository_id: { type: string, format: uuid, nullable: true }
        priority: { type: string, enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST] }
        due_at: { type: string, format: date-time, nullable: true }
        estimate_points:
          { type: integer, minimum: 0, maximum: 100, nullable: true }
        sprint_id: { type: string, format: uuid, nullable: true }
        expected_version: { type: integer, minimum: 1 }
    TransitionRequest:
      type: object
      required: [transition_key, expected_version]
      properties:
        transition_key: { type: string }
        expected_version: { type: integer, minimum: 1 }
    AssignmentRequest:
      type: object
      required: [assignee_id, expected_version]
      properties:
        assignee_id:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Empty string or null unassigns the item,
          }
        expected_version: { type: integer, minimum: 1 }
    SpecificationUpdateRequest:
      type: object
      properties:
        expected_version: { type: integer, minimum: 1 }
        summary: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        reproduction_steps: { type: array, items: { $ref: "#/components/schemas/ReproductionStep" } }
        acceptance_criteria: { type: array, items: { $ref: "#/components/schemas/AcceptanceCriterion" } }
        regression_test_cases:
          { type: array, items: { $ref: "#/components/schemas/RegressionTestCase" } }
        context_refs:
          { type: array, items: { $ref: "#/components/schemas/SpecificationContextRef" } }
        media_refs:
          type: object
          maxProperties: 100
          additionalProperties:
            type: array
            maxItems: 10
            items: { type: string, maxLength: 512 }
        repository_id: { type: string, format: uuid }
    SpecificationReviewRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
    ProposalRequest:
      type: object
      required: [field, value, provenance]
      properties:
        field: { type: string }
        value: { type: string }
        provenance: { type: string, enum: [AI_INFERRED, AI_HYPOTHESIS] }
    VerificationRequest:
      type: object
      properties:
        kind:
          {
            type: string,
            enum: [field, reproduction_step, acceptance_criterion, regression_case],
          }
        field: { type: string }
        position: { type: integer, minimum: 1 }
    WorkItemResponse:
      type: object
      required: [id, key, title, status, version]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        version: { type: integer }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        type: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        priority: { type: string, enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST] }
        assignee_id: { type: string, format: uuid, nullable: true }
        reporter_id: { type: string, format: uuid, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        estimate_points: { type: integer, minimum: 0, nullable: true }
        backlog_rank: { type: integer, format: int64 }
        repository_id: { type: string, format: uuid, nullable: true }
        sprint_id: { type: string, format: uuid, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        archived_by: { type: string, nullable: true }
    WorkflowStatus:
      type: object
      required: [key, display_name, category, position, is_terminal]
      properties:
        key: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,31}$" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [TODO, IN_PROGRESS, DONE, CANCELLED] }
        position: { type: integer }
        is_terminal: { type: boolean }
    WorkflowTransition:
      type: object
      required: [key, from_status, to_status, display_name]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
        from_status: { type: string }
        to_status: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        required_rules:
          type: array
          items:
            type: string
            enum: [require_specification_ready, require_human_verification, require_assignee, require_repository, require_pull_request, require_ci_success, require_permission]
        required_permissions:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: "^[a-z][a-z0-9_.]{1,127}$"
    SaveWorkflowRequest:
      type: object
      required: [name, statuses, transitions]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        statuses:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/WorkflowStatus" }
        transitions:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/WorkflowTransition" }
    WorkflowResponse:
      type: object
      required: [id, name, statuses, transitions]
      properties:
        id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        statuses:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStatus" }
        transitions:
          type: array
          items: { $ref: "#/components/schemas/WorkflowTransition" }
    AuditRecord:
      type: object
      required: [id, actor_type, actor_id, action, resource_type, resource_id, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_type: { type: string }
        actor_id: { type: string }
        source: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        before: { nullable: true }
        after: { nullable: true }
        request_id: { type: string }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
    GitHubRepository:
      type: object
      required:
        [
          id,
          github_repository_id,
          full_name,
          default_branch,
          installation_id,
          linked,
        ]
      properties:
        id: { type: string, format: uuid }
        github_repository_id: { type: integer, format: int64 }
        full_name: { type: string }
        default_branch: { type: string }
        clone_url: { type: string, format: uri }
        installation_id: { type: integer, format: int64 }
        installation_account: { type: string }
        linked: { type: boolean }
    GitHubInstallation:
      type: object
      required: [id, github_installation_id, account_login, created_at]
      properties:
        id: { type: string, format: uuid }
        github_installation_id: { type: integer, format: int64 }
        account_login: { type: string }
